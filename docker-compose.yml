services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tadpoles-postgres
    environment:
      POSTGRES_DB: ai_resume
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    container_name: tadpoles-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: tadpoles_billing
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: tadpoles-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

  billing:
    build:
      context: ./services/billing
      dockerfile: Dockerfile
    container_name: tadpoles-billing
    ports:
      - "8084:8084"
      - "9094:9094"
    environment:
      DB_DSN: "root:root123@tcp(mysql:3306)/tadpoles_billing?charset=utf8mb4&parseTime=True&loc=UTC"
      REDIS_ADDR: "redis:6379"
      SERVER_PORT: "8084"
      GRPC_PORT: "9094"
    depends_on:
      - mysql
      - redis
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
  mysqldata:
  redisdata:
